# GluChron on a DigitalOcean Droplet
#
# 1. Create a Docker Droplet (1 GB is enough). Open TCP 22, 80, and 443.
# 2. Clone this repo onto the droplet, then:
#      cp .env.example .env   # fill LibreLinkUp + PGP_PASSPHRASE
#      # Optional: copy existing data/keys/*.asc and data/*.asc onto the host
# 3. Point an A/AAAA record at the droplet and set GLUCHRON_SITE to that hostname
#    in .env (leave GLUCHRON_SITE=:80 to serve HTTP on the droplet IP).
# 4. docker compose up -d
#
# The poller container also runs the PHP API (loopback AUTH_LISTEN plus
# /api/keys enrollment). Caddy serves ./public and reverse-proxies /api/*
# to that API. ./data holds the PGP keys, the encrypted LibreLinkUp session,
# and the poll-state file.

name: gluchron

services:
  poller:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      TZ: UTC
      HOST: 0.0.0.0
      PORT: "8765"
    expose:
      - "8765"
    volumes:
      - ./data:/app/data
      - ./public:/app/public
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

  web:
    image: caddy:2-alpine
    restart: unless-stopped
    # Wait for the poller's PHP API to listen before serving the dashboard, so
    # the dashboard's POST /api/keys never lands on a not-yet-ready API (Caddy
    # would answer an empty 502, which the PWA reports as "Could not enroll the
    # public key.").
    depends_on:
      poller:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GLUCHRON_SITE: ${GLUCHRON_SITE:-:80}
    volumes:
      - ./public:/srv:ro
      # bin/link-pwa.php symlinks the engine PWA into public/ with relative
      # targets (../vendor/bitbasket/gluchron-core/pwa/...). Caddy's root is /srv,
      # so ../vendor resolves to /vendor inside the container: mount the PWA
      # there or every symlink dangles (404 assets, 404 on /).
      - ./vendor/bitbasket/gluchron-core/pwa:/vendor/bitbasket/gluchron-core/pwa:ro
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
